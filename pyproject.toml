[project]
name = "bazaar-agent"
version = "0.1.0"
description = "A production-grade WhatsApp commerce agent for Indonesian SMBs, measured by BazaarBench."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rizky Nanda Praditia" }]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.28,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",  # openai v3 transport; imported directly by tests
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bazaar"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "S",        # bandit (security)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "live: calls a real LLM endpoint; skipped unless BAZAAR_RUN_LIVE=1",
]
