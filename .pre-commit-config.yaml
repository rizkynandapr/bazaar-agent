repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-env-files
        name: block .env commits
        entry: .env files must not be committed
        language: fail
        files: '(^|/)\.env$'
